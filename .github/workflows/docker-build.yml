name: Docker build

on:
  push:
    branches: [main]
    paths:
      - lenlion_agent/Dockerfile
      - lenlion_agent/.dockerignore
      - lenlion_agent/DEPLOYMENT.md
      - lenlion_agent/pyproject.toml
      - lenlion_agent/uv.lock
      - lenlion_agent/web/**
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: lenlion_agent
          file: lenlion_agent/Dockerfile
          load: true
          tags: lenlion-agent:ci
          cache-from: type=gha,scope=lenlion-docker
          cache-to: type=gha,mode=max,scope=lenlion-docker

      - name: Smoke test CLI
        run: docker run --rm lenlion-agent:ci lenlion --help

      - name: Smoke test web dist baked in image
        run: docker run --rm lenlion-agent:ci test -f /opt/lenlion/hermes_cli/web_dist/index.html
