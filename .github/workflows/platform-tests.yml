name: Platform Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Always run on PRs so a future required check never stays pending when
  # only unrelated paths change (same rationale as tests.yml).
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lenlion_platform

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lenlion
          POSTGRES_PASSWORD: lenlion
          POSTGRES_DB: lenlion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lenlion -d lenlion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            lenlion_platform/pyproject.toml
            lenlion_platform/uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Run unit tests (memory store)
        run: uv run pytest -q -m "not postgres_smoke"

      - name: Run Postgres smoke
        run: uv run pytest -q -m postgres_smoke
        env:
          DATABASE_URL: postgresql://lenlion:lenlion@127.0.0.1:5432/lenlion
          LENLION_PLATFORM_POSTGRES_SMOKE: "1"
