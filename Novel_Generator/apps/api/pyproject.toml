[project]
name = "novel-generator-api"
version = "0.1.0"
description = "AI Novel Generator API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "pydantic>=2.13.0,<3",
  "pydantic-settings>=2.0.0,<3",
  "sqlalchemy>=2.0.0,<3",
  "alembic>=1.13.0,<2",
  "psycopg[binary]>=3.2.0,<4",
  "pytest>=8.0.0,<9",
  "httpx>=0.28.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
