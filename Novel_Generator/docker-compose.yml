services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery-worker:
    profiles: ["celery"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/api:/app
    env_file:
      - ./apps/api/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      GENERATION_QUEUE_BACKEND: celery
    command: >
      sh -c "pip install -e . -q &&
             python ../scripts/run_celery_worker.py"
    depends_on:
      - redis
