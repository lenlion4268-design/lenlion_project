name: lenlion-platform

# Cloud stack: Postgres + control-plane + model-gateway.
# Lenlion Agent runs locally on user machines; point DATABASE_URL at this Postgres.
# After first postgres start, also apply agent schema (once per database):
#   psql "$DATABASE_URL" -f ../lenlion_agent/docker/postgres/init.sql

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenlion-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenlion
      POSTGRES_PASSWORD: lenlion
      POSTGRES_DB: lenlion
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/02-platform-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenlion -d lenlion"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  control-plane:
    image: python:3.12-slim
    container_name: lenlion-control-plane
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lenlion:lenlion@postgres:5432/lenlion
      PLATFORM_JWT_SECRET: dev-platform-jwt-secret-change-me
      ADMIN_TOKEN: dev-admin-token-change-me
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - pip install -q -e . && uvicorn control_plane.app:create_app --factory --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"

  model-gateway:
    image: python:3.12-slim
    container_name: lenlion-model-gateway
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lenlion:lenlion@postgres:5432/lenlion
      PLATFORM_JWT_SECRET: dev-platform-jwt-secret-change-me
      OPENAI_COMPAT_BASE_URL: https://api.openai.com/v1
      UPSTREAM_OPENAI_API_KEY: replace-me
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - pip install -q -e . && uvicorn model_gateway.app:create_app --factory --host 0.0.0.0 --port 8081
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  platform-postgres-data:
