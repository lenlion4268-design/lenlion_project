[project]
name = "lenlion-platform"
version = "0.5.0"
description = "Lenlion cloud control plane and model gateway"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "pydantic>=2.13.0,<3",
  "psycopg[binary]>=3.2.0,<4",
  "PyJWT>=2.13.0,<3",
  "httpx>=0.28.0,<1",
  "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane", "model_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres_smoke: real Postgres dual-init + shared db layer (requires LENLION_PLATFORM_POSTGRES_SMOKE=1)",
]
